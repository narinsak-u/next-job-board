services:
  db:
    image: postgres:17.0
    hostname: ${DB_HOST}
    ports:
      - "5432:${DB_PORT}"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  inngest:
    image: inngest/inngest
    ports:
      - "8288:8288"
      - "8289:8289"
    command: "inngest dev -u http://host.docker.internal:3000/api/inngest"

volumes:
  pgdata:
